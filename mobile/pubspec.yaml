name: namma_kural
description: "Namm Kural — Tamil Nadu civic grievance redressal (citizen app)."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State / DI
  flutter_riverpod: ^2.6.1
  # Navigation
  go_router: ^14.6.0
  # Networking
  dio: ^5.7.0
  http_parser: ^4.0.2
  # Map (Leaflet equivalent: OSM tiles + polygons + markers)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  # Device capabilities
  geolocator: ^13.0.2
  image_picker: ^1.1.2
  record: ^5.2.0
  audioplayers: ^6.1.0
  path_provider: ^2.1.5
  # Persistence (auth flag, user id, daily fair-use quotas)
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/community/
